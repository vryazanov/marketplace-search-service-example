name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - run: uv run ruff check src/ bin/
      - run: uv run ruff format --check src/ bin/

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - run: uv run pytest tests/ -v

  build:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}

  deploy-request:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Register image in VLMS
        env:
          LMS_API_KEY: ${{ secrets.LMS_API_KEY }}
          IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          jq -n --arg image "$IMAGE" --arg repository "$REPOSITORY" \
            '{image: $image, repository: $repository}' > request.json
          curl --fail-with-body --silent --show-error \
            -H "Content-Type: application/json" \
            -H "X-API-Key: $LMS_API_KEY" \
            --data-binary @request.json \
            https://lms.python-labs.ru/api/deploy-requests
